<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Waiver Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; color: #011A36; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  header { background: #011A36; color: #fff; padding: 14px 16px; border-bottom: 2px solid #F5C542; font-weight: 700; letter-spacing: .5px; }
  header span { color: #F5C542; }
  main { max-width: 900px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #5B9BD5; margin: 1.5rem 0 .6rem; }
  .card { background: #383D44; color: #e2e8f0; border-radius: 8px; padding: 1rem; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 13px; border-top: .5px solid #4b515a; }
  .row:first-of-type { border-top: none; }
  .muted { color: #a8b0bd; font-size: 11px; }
  .pos { color: #5B9BD5; display: inline-block; min-width: 28px; font-size: 11px; }
  .note { font-size: 12px; color: #64748b; line-height: 1.5; margin-bottom: 1rem; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>WAIVER <span>LAB</span> · private</header>
<main id="app"><p class="note">Loading…</p></main>
<script>
const esc = (s) => String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
fetch('data.json?_=' + Date.now()).then(r => r.json()).then(all => {
  const w = all['2026'] && all['2026'].waiverIntel;
  const app = document.getElementById('app');
  if (!w) { app.innerHTML = '<p class="note">No waiver data yet. Run the sync once the waiver-intel step is deployed.</p>'; return; }
  const when = new Date(w.generated).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });
  const targetRow = (t) => `<div class="row"><span><span class="pos">${esc(t.pos)}</span>${esc(t.player)} <span class="muted">${esc(t.nfl)}</span><br><span class="muted">${esc(t.reason)}</span></span><span style="white-space:nowrap">$${t.lo}–${t.hi}</span></div>`;
  app.innerHTML = `
    <p class="note"><b>Predictions for week ${w.week} claims</b> · updated ${esc(when)}. A model, not a crystal ball: it ranks free agents by trending adds and player rank, matches them to each team's needs (injuries, thin positions, weak starters), and estimates bids from each manager's history and remaining budget. Sleeper doesn't show other teams' pending claims.</p>
    ${w.pending.length ? `<h2>Pending claims spotted</h2><div class="card">${w.pending.map(p => `<div class="row"><span>${esc(p.team)} → ${esc(p.player)}</span><span>$${p.bid}</span></div>`).join('')}</div>` : ''}
    <h2>My targets · Aron</h2>
    <div class="card">${w.mine.length ? w.mine.map(m => `<div class="row"><span><span class="pos">${esc(m.pos)}</span>${esc(m.player)}<br><span class="muted">${m.rivals.length ? 'Likely rivals: ' + esc(m.rivals.join(', ')) : 'No rivals predicted'}</span></span><span style="white-space:nowrap">bid $${m.beat}+ to beat them</span></div>`).join('') : '<span class="muted">No targets yet.</span>'}</div>
    <h2>Most contested players</h2>
    <div class="card">${w.hot.map(h => `<div class="row"><span><span class="pos">${esc(h.pos)}</span>${esc(h.player)} <span class="muted">${esc(h.nfl)}${h.adds ? ' · ' + h.adds + ' adds' : ''}</span></span><span class="muted">${esc(h.by.map(b => b.team).join(', '))}</span></div>`).join('') || '<span class="muted">Nothing contested yet.</span>'}</div>
    <h2>Team by team</h2>
    <div class="grid">${w.teams.map(t => {
      const needs = Object.entries(t.needs).filter(([, v]) => v >= 1.5).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([p]) => p).join(', ') || 'none flagged';
      return `<div class="card"><p style="font-weight:600;font-size:15px">${esc(t.name)}</p>
        <p class="muted" style="margin:2px 0 8px">$${t.remaining} left · priority ${esc(t.priority)} · avg bid $${t.avgBid} (${t.claims} claims) · needs: ${esc(needs)}</p>
        ${t.targets.slice(0, 3).map(targetRow).join('') || '<span class="muted">No budget left.</span>'}</div>`;
    }).join('')}</div>`;
}).catch(() => { document.getElementById('app').innerHTML = '<p class="note">Could not load data.json.</p>'; });
</script>
</body>
</html>
